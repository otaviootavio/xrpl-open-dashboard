<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRPL Transfer Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #f5f7f6; --surface: #fcfdfc; --sunk: #edf1ef;
    --ink: #0f1d1a; --ink-2: #44524e; --muted: #7a8783;
    --grid: #dfe5e2; --axis: #c2ccc8; --border: rgba(15,29,26,0.11);
    --accent-ink: #075e50; --s1: #0b7a68;
    /* graph categorical slots 1-3 (reference palette: the first three validate all-pairs in both modes) */
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c-other: #a5aeaa; --edge: #b9c3bf; --edge-hi: #44524e;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d1412; --surface: #141d1a; --sunk: #101816;
      --ink: #e6eeeb; --ink-2: #b3c0bb; --muted: #83918c;
      --grid: #25302c; --axis: #34413c; --border: rgba(230,238,235,0.10);
      --accent-ink: #6fd6c1; --s1: #35b89f;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c-other: #5e6965; --edge: #34413c; --edge-hi: #b3c0bb;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d1412; --surface: #141d1a; --sunk: #101816;
    --ink: #e6eeeb; --ink-2: #b3c0bb; --muted: #83918c;
    --grid: #25302c; --axis: #34413c; --border: rgba(230,238,235,0.10);
    --accent-ink: #6fd6c1; --s1: #35b89f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c-other: #5e6965; --edge: #34413c; --edge-hi: #b3c0bb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--body); }
  header { padding: 16px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font: 600 22px/1.2 var(--display); margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; padding: 8px 16px 12px; max-width: 1400px; margin: 0 auto; }
  .controls label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); }
  select, input[type=search] { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; min-height: 34px; }
  input[type=search] { width: min(320px, 80vw); font-family: var(--mono); font-size: 12px; }
  input[type=range] { width: 140px; accent-color: var(--s1); }
  button { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; min-height: 34px; cursor: pointer; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 0 16px 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  #stage { position: relative; height: min(72vh, 760px); min-height: 380px; overflow: hidden; }
  #sigma { position: absolute; inset: 0; }
  #legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px;
    color: var(--ink-2); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 6px 8px; border-radius: 6px; max-width: calc(100% - 24px); }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #flow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #note { position: absolute; right: 12px; top: 10px; font-size: 12px; color: var(--muted); }
  #panel { padding: 14px 16px; overflow: auto; max-height: min(72vh, 760px); }
  #panel h2 { font: 600 16px/1.25 var(--display); margin: 0 0 8px; word-break: break-all; }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
  #panel dt { color: var(--ink-2); } #panel dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  #panel .hint { color: var(--muted); font-size: 13px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--accent-ink); }
  #loops { display: none; padding: 16px; }
  #loops svg { width: 100%; height: auto; display: block; }
  #loops table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  #loops th, #loops td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  #loops td.num, #loops th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; white-space: nowrap; }
  .empty { padding: 40px 16px; color: var(--ink-2); text-align: center; }
  #crumbs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--ink-2); min-height: 20px; }
  #crumbs button { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent-ink); font: inherit; cursor: pointer; text-decoration: underline; }
  #crumbs span.sep { color: var(--muted); }
  .switch { flex-direction: row !important; align-items: center; gap: 6px !important; min-height: 34px; }
  .switch input { accent-color: var(--s1); width: 16px; height: 16px; margin: 0; }
  #panel .summary { color: var(--ink-2); font-size: 13px; margin: -4px 0 12px; }
</style>
</head>
<body>
<header>
  <h1>XRPL Transfer Graph</h1>
  <p class="sub" id="subtitle">Who pays whom on the XRP Ledger, by month. Nodes are entities (accounts grouped by on-ledger evidence); edges are summed transfers.</p>
</header>
<div class="controls" id="controls">
  <label>Month <select id="month"></select></label>
  <label>Asset <select id="asset"></select></label>
  <label>View <select id="view">
    <option value="backbone">Backbone (top 300)</option>
    <option value="communities">Community map</option>
    <option value="community">One community</option>
    <option value="ego">Ego view</option>
    <option value="loops">Loops over time</option>
  </select></label>
  <label>Colour by <select id="colour"><option value="role">Role</option><option value="community">Community</option></select></label>
  <label>Min edge weight <input type="range" id="minw" min="0" max="100" value="0"></label>
  <label class="switch"><input type="checkbox" id="alledges"> Show all edges</label>
  <label class="switch"><input type="checkbox" id="animate"> Animate flow</label>
  <label>Find an account <input type="search" id="search" placeholder="r… address or entity id" list="egolist"></label>
  <datalist id="egolist"></datalist>
</div>
<main>
  <nav id="crumbs" aria-label="Where you are"></nav>
  <section class="card" id="stage">
    <div id="sigma" role="img" aria-label="Network graph of transfers"></div>
    <canvas id="flow" aria-hidden="true"></canvas>
    <div id="legend"></div>
    <div id="note"></div>
  </section>
  <aside class="card" id="panel"><p class="hint">Hover a node to see its neighbours. Click it for details and sample transactions.</p></aside>
  <section class="card" id="loops" style="grid-column: 1 / -1"></section>
</main>
<div class="tip" id="tip"></div>
<script src="vendor/graphology.umd.min.js"></script>
<script src="vendor/sigma.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (x, d = 3) => x == null ? "–" : Math.abs(x) >= 1e6 ? (x / 1e6).toFixed(2) + " M" : Math.abs(x) >= 1e3
  ? (x / 1e3).toFixed(1) + " k" : (+x).toPrecision(d).replace(/\.?0+$/, "");
const ROLE_COLOURS = [["issuer", "--c1", "Issuer"], ["likely_custodial", "--c2", "Likely custodial"], ["amm_pool", "--c3", "AMM pool"]];
const EXPLORER = "https://livenet.xrpl.org/transactions/";
let animOn = !matchMedia("(prefers-reduced-motion: reduce)").matches, flowEdges = [], flowRaf = 0;
let INDEX = { views: [] }, renderer = null, graph = null, hovered = null, state = {};

const LABELS_DEFAULT = 30;                 // labels at default zoom; graph/layout.py LABELS_DEFAULT
let bundles = new Map(), labelLimit = LABELS_DEFAULT;

function readHash() {
  // "~"-separated: only plain #anchors (letters, digits, . _ ~ -) reach a published page
  // #<view>~<month>~<label>[~<arg>][~all]; arg = C<n> for one community, the entity id for an ego view
  const parts = location.hash.slice(1).split("~");
  const all = parts[parts.length - 1] === "all";
  if (all) parts.pop();
  const [view, month, label, arg] = parts;
  return { view, month, label, arg, all };
}
function hashOf(s) {
  const parts = [s.view, s.month, s.label];
  if (s.view === "ego" && s.centre) parts.push(s.centre);
  if (s.view === "community" && s.comm) parts.push(s.comm);
  if (s.all) parts.push("all");
  return "#" + parts.join("~");
}
function writeHash(push) {
  const h = hashOf(state);
  if (h === location.hash) return;
  if (push) history.pushState(null, "", h); else history.replaceState(null, "", h);
}

function nodeColour(attrs) {
  const other = css("--c-other");
  if (state.colour === "community" || attrs.community != null && graph.getAttribute("kind") === "communities") {
    const c = attrs.community;
    return c === 0 ? css("--c1") : c === 1 ? css("--c2") : c === 2 ? css("--c3") : other;
  }
  const hit = ROLE_COLOURS.find(([r]) => r === attrs.role);
  return hit ? css(hit[1]) : other;
}

function legend() {
  const el = $("legend"); const kind = graph && graph.getAttribute("kind");
  const items = state.colour === "community" || kind === "communities"
    ? [["--c1", "Community 0 (largest)"], ["--c2", "Community 1"], ["--c3", "Community 2"], ["--c-other", "Smaller communities"]]
    : [...ROLE_COLOURS.map(([, v, l]) => [v, l]), ["--c-other", "Hub, bot pair or unknown"]];
  el.innerHTML = items.map(([v, l]) => `<span><i style="background:${css(v)}"></i>${l}</span>`).join("")
    + (animOn ? "<span>Dots move from payer to payee: faster = larger average transfer, more dots = more transfers</span>" : "");
}

function draw(data) {
  if (renderer) { renderer.kill(); renderer = null; }
  graph = graphology.Graph.from(data);
  const sizes = graph.mapEdges((e, a) => a.size || 1);
  const maxSize = Math.max(1, ...sizes);
  const edgeCol = css("--edge"), edgeHi = css("--edge-hi");
  renderer = new Sigma(graph, $("sigma"), {
    defaultEdgeType: animOn ? "line" : "arrow", renderEdgeLabels: false, labelFont: "IBM Plex Sans", labelSize: 11,
    labelColor: { color: css("--ink-2") }, labelRenderedSizeThreshold: 0, labelGridCellSize: 120, zIndex: true,
    nodeReducer: (n, a) => {
      const r = { ...a, color: nodeColour(a), label: a.label };
      if (a.label_rank != null && a.label_rank >= labelLimit && n !== hovered) r.label = null;
      if (hovered && n !== hovered && !graph.areNeighbors(n, hovered)) { r.color = css("--grid"); r.label = ""; r.zIndex = 0; }
      if (a.centre || n === hovered) { r.highlighted = true; r.zIndex = 2; }
      return r;
    },
    edgeReducer: (e, a) => {
      const r = { ...a, color: edgeCol, size: Math.max(0.3, a.size * 0.8), type: animOn ? "line" : "arrow" };
      if (a.size < (state.minw / 100) * maxSize) r.hidden = true;
      if (!state.all && a.bb === 0) r.hidden = true;
      if (hovered) { if (graph.hasExtremity(e, hovered)) { r.color = edgeHi; r.zIndex = 1; } else r.hidden = true; }
      return r;
    },
  });
  renderer.on("enterNode", ({ node }) => { hovered = node; renderer.refresh(); });
  renderer.on("leaveNode", () => { hovered = null; renderer.refresh(); });
  renderer.on("clickNode", ({ node }) => {
    const a = graph.getNodeAttributes(node);
    if (graph.getAttribute("kind") === "communities" && a.has_detail) openCommunity(node); else panel(node);
  });
  labelLimit = LABELS_DEFAULT;
  renderer.getCamera().on("updated", ({ ratio }) => {
    const lim = Math.round(LABELS_DEFAULT / Math.min(1, ratio));
    if (lim !== labelLimit) { labelLimit = lim; renderer.refresh(); }
  });
  note();
  legend();
  startFlow();
}

// Animated flow: dots travel source -> target along each drawn edge. Speed (px/s) follows the mean transfer size
// on a log scale, the number of dots follows the transfer count. It encodes volume; it is not a replay in time.
const FLOW_MAX_DOTS = 4000, FLOW_V_MIN = 22, FLOW_V_MAX = 170;
function flowPrepare() {
  const ms = [];
  graph.forEachEdge((e, a) => { if (a.value > 0 && a.n > 0) ms.push(Math.log10(a.value / a.n)); });
  ms.sort((x, y) => x - y);
  const lo = ms.length ? ms[Math.floor(ms.length * 0.05)] : 0, hi = ms.length ? ms[Math.floor(ms.length * 0.95)] : 1;
  return { lo, span: Math.max(hi - lo, 1e-6) };
}
function flowDot(e, a, sc, i) {
  const t = a.value > 0 && a.n > 0 ? Math.min(1, Math.max(0, (Math.log10(a.value / a.n) - sc.lo) / sc.span)) : 0.5;
  let h = 0; for (let k = 0; k < e.length; k++) h = (h * 31 + e.charCodeAt(k)) >>> 0;
  return { v: FLOW_V_MIN + t * (FLOW_V_MAX - FLOW_V_MIN), k: Math.max(1, Math.min(5, Math.round(1 + Math.log2(a.n || 1) / 2))), off: (h % 1000) / 1000 };
}
function startFlow() {
  cancelAnimationFrame(flowRaf); flowRaf = 0;
  const cv = $("flow"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!animOn || !renderer || !graph) return;
  const sc = flowPrepare(), cache = new Map(), t0 = performance.now();
  const frame = (now) => {
    if (!animOn || !renderer || !graph) return;
    const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = css("--edge-hi");
    const secs = (now - t0) / 1000, list = [];
    graph.forEachEdge((e, a, s, t, sa, ta) => {
      if (renderer.getEdgeDisplayData(e)?.hidden) return;
      list.push([e, a, s, t]);
    });
    const budget = Math.max(1, Math.floor(FLOW_MAX_DOTS / Math.max(1, list.length)));
    for (const [e, a, s, t] of list) {
      const p = renderer.graphToViewport(graph.getNodeAttributes(s)), q = renderer.graphToViewport(graph.getNodeAttributes(t));
      const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
      if (len < 12 || (p.x < -50 && q.x < -50) || (p.x > w + 50 && q.x > w + 50) || (p.y < -50 && q.y < -50) || (p.y > h + 50 && q.y > h + 50)) continue;
      let d = cache.get(e); if (!d) cache.set(e, d = flowDot(e, a, sc));
      const k = Math.min(d.k, budget), r = 1.6 + d.v / FLOW_V_MAX * 1.2;
      for (let i = 0; i < k; i++) {
        const f = (secs * d.v / len + i / k + d.off) % 1;
        const fade = Math.min(1, f / 0.1, (1 - f) / 0.1);
        ctx.globalAlpha = 0.25 + 0.7 * fade;
        ctx.beginPath(); ctx.arc(p.x + dx * f, p.y + dy * f, r, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    flowRaf = requestAnimationFrame(frame);
  };
  flowRaf = requestAnimationFrame(frame);
}

function note() {
  if (!graph) return;
  const at = graph.getAttributes(), bbN = at.n_backbone_edges, hiddenEdges = at.n_hidden_edges;
  const drawn = state.all || bbN == null ? graph.size : bbN;
  $("note").textContent = `${graph.order} nodes · ${drawn.toLocaleString()} edges`
    + (!state.all && bbN != null && bbN < graph.size ? ` · ${(graph.size - bbN).toLocaleString()} weaker edges hidden` : "")
    + (hiddenEdges ? ` · ${hiddenEdges.toLocaleString()} lighter edges not loaded` : "");
}

function crumbs() {
  const el = $("crumbs"), parts = [], s = state;
  const btn = (text, fn) => { const b = document.createElement("button"); b.textContent = text; b.onclick = fn; return b; };
  parts.push(document.createTextNode(`${s.month} › ${s.label} › `));
  if (s.view === "community" || (s.view === "ego" && s.from)) {
    parts.push(btn("Community map", () => navigate({ view: "communities", comm: undefined, centre: undefined, from: undefined })));
    if (s.view === "community") parts.push(document.createTextNode(` › ${s.commName || s.comm}`));
    else {
      parts.push(document.createTextNode(" › "));
      parts.push(btn(s.from.name || s.from.comm, () => navigate({ view: "community", comm: s.from.comm, centre: undefined, from: undefined })));
      parts.push(document.createTextNode(` › ${(s.centre || "").slice(0, 10)}…`));
    }
  } else {
    const names = { backbone: "Backbone", communities: "Community map", ego: "Ego view", loops: "Loops over time" };
    parts.push(document.createTextNode(names[s.view] + (s.view === "ego" && s.centre ? ` › ${s.centre.slice(0, 10)}…` : "")));
  }
  el.replaceChildren(...parts);
}

function navigate(change) {
  Object.assign(state, change);
  $("view").value = state.view;
  render(true);
}

function openCommunity(node) {
  const a = graph.getNodeAttributes(node);
  navigate({ view: "community", comm: node, commName: a.name, centre: undefined, from: undefined });
}

function panel(node) {
  const a = graph.getNodeAttributes(node), kind = graph.getAttribute("kind"), unit = state.label === "all" ? "transfers" : state.label.split("-")[0];
  const rows = kind === "communities"
    ? [["Entities", a.n_entities?.toLocaleString()], ["Largest members", (a.top_entities || []).map(x => `<code>${x.slice(0, 10)}…</code>`).join("<br>")]]
    : [["Role", (a.role || "unknown").replace("_", " ")], ["Accounts in entity", a.n_accounts], ["Community", a.community ?? "–"],
       ["Bow-tie part", a.bowtie], ["PageRank", fmt(a.pagerank)], ["Transfers in / out", `${fmt(a.in_n)} / ${fmt(a.out_n)}`],
       ...(state.label !== "all" ? [[`Value in / out (${unit})`, `${fmt(a.in_value)} / ${fmt(a.out_value)}`]] : []),
       ["Flow Index A1 / A2", `${fmt(a.flow_in)} / ${fmt(a.flow_out)}`], ...(a.ppr != null ? [["Personalized PageRank", fmt(a.ppr)]] : [])];
  const top = graph.edges(node).map(e => [e, graph.getEdgeAttributes(e)]).sort((x, y) => (y[1].n || 0) - (x[1].n || 0)).slice(0, 5);
  const tx = top.flatMap(([e, ea]) => (ea.hashes || []).slice(0, 1).map(h =>
    `<li><a href="${EXPLORER}${h}" target="_blank" rel="noopener"><code>${h.slice(0, 12)}…</code></a> ${graph.source(e) === node ? "to" : "from"} <code>${(graph.source(e) === node ? graph.target(e) : graph.source(e)).slice(0, 8)}</code></li>`));
  $("panel").innerHTML = `<h2>${kind === "communities" ? (a.name || a.label) : `<code>${node}</code>`}</h2>`
    + (kind === "communities" && a.summary ? `<p class="summary">${a.summary}</p>` : "")
    + (kind === "communities" && a.detail ? `<p class="hint">${a.detail}</p>` : "")
    + `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v ?? "–"}</dd>`).join("")}</dl>`
    + (kind !== "communities" ? `<button id="egobtn">Open ego view</button>` : "")
    + (kind === "communities" && a.has_detail ? `<button id="commbtn">Open community</button>` : "")
    + (tx.length ? `<p class="hint">Sample transactions on its biggest edges:</p><ul class="mono">${tx.join("")}</ul>` : "");
  const b = $("egobtn"); if (b) b.onclick = () => openEgo(node);
  const cb = $("commbtn"); if (cb) cb.onclick = () => openCommunity(node);
}

function openEgo(centre) {
  const v = INDEX.views.find(x => x.kind === "ego" && x.month === state.month && x.label === state.label && x.centre === centre);
  if (!v) {
    $("panel").insertAdjacentHTML("beforeend", `<p class="hint">No precomputed ego view for this entity. Build one with<br><code>uv run graph/run.py ego ${centre} --month ${state.month} --asset ${state.label.split("-")[0]}</code></p>`);
    return;
  }
  const from = state.view === "community" ? { comm: state.comm, name: state.commName } : undefined;
  navigate({ view: "ego", centre, from });
}

async function render(push) {
  writeHash(push);
  crumbs();
  const loops = state.view === "loops";
  $("loops").style.display = loops ? "block" : "none";
  $("stage").style.display = $("panel").style.display = loops ? "none" : "";
  if (loops) return drawLoops();
  let v;
  if (state.view === "ego") {
    const egos = INDEX.views.filter(x => x.kind === "ego" && x.month === state.month && x.label === state.label);
    $("egolist").innerHTML = egos.map(x => `<option value="${x.centre}">`).join("");
    v = egos.find(x => x.centre === state.centre) || egos[0];
    if (v) state.centre = v.centre;
  } else if (state.view === "community") {
    v = INDEX.views.find(x => x.kind === "community_detail" && x.month === state.month && x.label === state.label);
    if (v) {
      if (!bundles.has(v.file)) bundles.set(v.file, await (await fetch("graph/" + v.file)).json());
      const b = bundles.get(v.file).communities;
      if (!state.comm || !b[state.comm]) state.comm = Object.keys(b)[0];
      const data = b[state.comm];
      state.commName = data.attributes.name || state.comm;
      draw(data);
      $("panel").innerHTML = `<h2>${state.commName}</h2>` + (data.attributes.summary ? `<p class="summary">${data.attributes.summary}</p>` : "")
        + `<p class="hint">The ${graph.order} entities most strongly tied to <code>${state.commName.split(" · ")[1] || ""}</code> inside this community, with its significant edges. Hover a node to see its neighbours; click it for details.</p>`;
      writeHash(); crumbs();
      return;
    }
  } else {
    v = INDEX.views.find(x => x.kind === state.view && x.month === state.month && x.label === state.label);
  }
  if (!v) { if (renderer) renderer.kill(); renderer = null; graph = null; $("note").textContent = "No view for this month and asset."; return; }
  const data = await (await fetch("graph/" + v.file)).json();
  draw(data);
  if (state.view !== "ego") $("panel").innerHTML = '<p class="hint">Hover a node to see its neighbours. Click it for details' + (state.view === "communities" ? ", or to open the community." : " and sample transactions.") + "</p>";
  writeHash(); crumbs();
}

async function drawLoops() {
  const el = $("loops");
  let d;
  try { d = await (await fetch("graph/loops.json")).json(); } catch { el.innerHTML = '<p class="empty">No loop data yet.</p>'; return; }
  const series = ["XRP", "RLUSD", "all"].map((lab, i) => ({ lab, col: css(`--c${i + 1}`),
    pts: d.summary.filter(r => (r.asset_label === lab || (lab === "RLUSD" && r.asset_label.startsWith("RLUSD-"))) && r.loop_share != null)
      .map(r => [r.month, r.loop_share]) })).filter(s => s.pts.length);
  const months = [...new Set(d.summary.map(r => r.month))].sort();
  const W = 900, H = 320, L = 48, R = 90, T = 16, B = 34;
  const x = (m) => L + (months.length < 2 ? (W - L - R) / 2 : months.indexOf(m) * (W - L - R) / (months.length - 1));
  const y = (v) => T + (1 - v) * (H - T - B);
  const ink2 = css("--ink-2"), grid = css("--grid"), muted = css("--muted");
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of net flow that circulates in loops, by month">`;
  for (const t of [0, 0.25, 0.5, 0.75, 1]) svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${grid}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="${muted}">${t * 100}%</text>`;
  months.forEach((m, i) => { if (i % Math.ceil(months.length / 8) === 0 || i === months.length - 1) svg += `<text x="${x(m)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="${muted}">${m}</text>`; });
  for (const s of series) {
    svg += `<path d="${s.pts.map((p, i) => (i ? "L" : "M") + x(p[0]) + " " + y(p[1])).join("")}" fill="none" stroke="${s.col}" stroke-width="2"/>`;
    for (const p of s.pts) svg += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${s.col}" stroke="${css("--surface")}" stroke-width="2"/>`;
    const last = s.pts[s.pts.length - 1];
    svg += `<text x="${x(last[0]) + 10}" y="${y(last[1]) + 4}" font-size="12" fill="${ink2}">${s.lab} ${(last[1] * 100).toFixed(1)}%</text>`;
  }
  svg += `<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/><line id="cross" y1="${T}" y2="${H - B}" stroke="${ink2}" stroke-dasharray="3 3" visibility="hidden"/></svg>`;
  const rows = d.cycles.map(c => `<tr><td>${c.asset_label}</td><td class="num">${c.rank + 1}</td><td class="num">${c.length}</td><td>${c.entities.map(e => `<code>${e.slice(0, 8)}</code>`).join(" → ")} → <code>${c.entities[0].slice(0, 8)}</code></td><td class="num">${fmt(c.strength)}</td><td>${(c.hashes || []).slice(0, 2).map(h => `<a href="${EXPLORER}${h}" target="_blank" rel="noopener"><code>${h.slice(0, 10)}…</code></a>`).join(" ")}</td></tr>`).join("");
  el.innerHTML = `<h2 style="font:600 16px var(--display);margin:0 0 4px">Share of net flow that goes round in loops</h2>
    <p class="sub" style="margin:0 0 8px">Hodge decomposition of each month's net flow between entities: the rest is one-way (gradient) flow. Legend: ${series.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><i style="width:10px;height:10px;border-radius:50%;background:${s.col};display:inline-block"></i>${s.lab}</span>`).join("")}</p>
    ${svg}<h3 style="font:600 14px var(--display);margin:16px 0 0">Strongest cycles, ${d.cycles_month}</h3>
    <table><thead><tr><th>Asset</th><th class="num">Rank</th><th class="num">Length</th><th>Entities</th><th class="num">Strength</th><th>Sample transactions</th></tr></thead><tbody>${rows}</tbody></table>`;
  const tip = $("tip"), hit = el.querySelector("#hit"), cross = el.querySelector("#cross"), box = el.querySelector("svg");
  hit.addEventListener("mousemove", (ev) => {
    const r = box.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const m = months.reduce((b, mm) => Math.abs(x(mm) - px) < Math.abs(x(b) - px) ? mm : b, months[0]);
    cross.setAttribute("x1", x(m)); cross.setAttribute("x2", x(m)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${m}</b><br>` + series.map(s => { const p = s.pts.find(q => q[0] === m); return `${s.lab}: ${p ? (p[1] * 100).toFixed(1) + "%" : "–"}`; }).join("<br>");
    tip.style.display = "block"; tip.style.left = ev.pageX + 12 + "px"; tip.style.top = ev.pageY + 12 + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
}

function fillSelects() {
  const months = [...new Set(INDEX.views.map(v => v.month))].sort();
  const labels = [...new Set(INDEX.views.map(v => v.label))].sort((a, b) => (a === "XRP" ? -1 : b === "XRP" ? 1 : a.localeCompare(b)));
  $("month").innerHTML = months.map(m => `<option>${m}</option>`).join("");
  $("asset").innerHTML = labels.map(l => `<option>${l}</option>`).join("");
  const h = readHash();
  const views = ["backbone", "communities", "community", "ego", "loops"];
  state = { view: views.includes(h.view) ? h.view : "backbone", month: months.includes(h.month) ? h.month : months[months.length - 1],
            label: labels.includes(h.label) ? h.label : labels[0], centre: h.view === "ego" ? h.arg : undefined,
            comm: h.view === "community" ? h.arg : undefined, all: h.all, colour: "role", minw: 0 };
  $("month").value = state.month; $("asset").value = state.label; $("view").value = state.view; $("alledges").checked = !!state.all;
}

for (const id of ["month", "asset", "view"]) $(id).addEventListener("change", (e) => {
  state[id === "asset" ? "label" : id] = e.target.value;
  if (id !== "view") { state.centre = undefined; state.comm = undefined; }
  state.from = undefined;
  render(true); });
$("alledges").addEventListener("change", (e) => { state.all = e.target.checked; writeHash(); if (renderer) { renderer.refresh(); note(); } });
window.addEventListener("popstate", () => {
  const h = readHash();
  if (!h.view) return;
  Object.assign(state, { view: h.view, month: h.month || state.month, label: h.label || state.label,
    centre: h.view === "ego" ? h.arg : undefined, comm: h.view === "community" ? h.arg : undefined, all: h.all, from: undefined });
  $("month").value = state.month; $("asset").value = state.label; $("view").value = state.view; $("alledges").checked = !!state.all;
  render();
});
$("animate").checked = animOn;
$("animate").addEventListener("change", (e) => {
  animOn = e.target.checked;
  if (renderer) { renderer.setSetting("defaultEdgeType", animOn ? "line" : "arrow"); renderer.refresh(); legend(); }
  startFlow();
});
$("colour").addEventListener("change", (e) => { state.colour = e.target.value; if (renderer) { renderer.refresh(); legend(); } });
$("minw").addEventListener("input", (e) => { state.minw = +e.target.value; if (renderer) renderer.refresh(); });
$("search").addEventListener("change", (e) => {
  const q = e.target.value.trim(); if (!q) return;
  if (graph && graph.hasNode(q) && state.view !== "ego") { panel(q); hovered = q; renderer.refresh(); return; }
  const v = INDEX.views.find(x => x.kind === "ego" && x.month === state.month && x.label === state.label && x.centre === q);
  if (v) navigate({ view: "ego", centre: q, from: undefined }); else $("panel").innerHTML = `<p class="hint">No precomputed ego view for <code>${q}</code> in ${state.month}. Accounts inside a grouped entity use the entity id. Build one with<br><code>uv run graph/run.py ego ${q} --month ${state.month}</code></p>`;
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (renderer) { renderer.refresh(); legend(); } });

if (window.INLINE_GRAPH) {
  $("controls").style.display = "none"; $("subtitle").textContent = window.INLINE_NOTE || "";
  state = { colour: "role", minw: 0, label: "XRP" }; draw(window.INLINE_GRAPH);
} else {
  fetch("graph/index.json").then(r => r.json()).then(d => { INDEX = d; fillSelects(); render(); })
    .catch(() => { $("stage").innerHTML = '<p class="empty">No graph views yet: run <code>uv run graph/run.py all</code>.</p>'; });
}
</script>
</body>
</html>
