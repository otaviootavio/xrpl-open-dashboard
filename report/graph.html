<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRPL Transfer Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #f5f7f6; --surface: #fcfdfc; --sunk: #edf1ef;
    --ink: #0f1d1a; --ink-2: #44524e; --muted: #7a8783;
    --grid: #dfe5e2; --axis: #c2ccc8; --border: rgba(15,29,26,0.11);
    --accent-ink: #075e50; --s1: #0b7a68;
    /* graph categorical slots 1-3 (reference palette: the first three validate all-pairs in both modes) */
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c-other: #a5aeaa; --edge: #b9c3bf; --edge-hi: #44524e;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d1412; --surface: #141d1a; --sunk: #101816;
      --ink: #e6eeeb; --ink-2: #b3c0bb; --muted: #83918c;
      --grid: #25302c; --axis: #34413c; --border: rgba(230,238,235,0.10);
      --accent-ink: #6fd6c1; --s1: #35b89f;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c-other: #5e6965; --edge: #34413c; --edge-hi: #b3c0bb;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d1412; --surface: #141d1a; --sunk: #101816;
    --ink: #e6eeeb; --ink-2: #b3c0bb; --muted: #83918c;
    --grid: #25302c; --axis: #34413c; --border: rgba(230,238,235,0.10);
    --accent-ink: #6fd6c1; --s1: #35b89f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c-other: #5e6965; --edge: #34413c; --edge-hi: #b3c0bb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--body); }
  header { padding: 16px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font: 600 22px/1.2 var(--display); margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; padding: 8px 16px 12px; max-width: 1400px; margin: 0 auto; }
  .controls label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); }
  select, input[type=search] { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; min-height: 34px; }
  input[type=search] { width: min(320px, 80vw); font-family: var(--mono); font-size: 12px; }
  input[type=range] { width: 140px; accent-color: var(--s1); }
  button { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; min-height: 34px; cursor: pointer; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 0 16px 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  #stage { position: relative; height: min(72vh, 760px); min-height: 380px; overflow: hidden; }
  #sigma { position: absolute; inset: 0; }
  #legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px;
    color: var(--ink-2); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 6px 8px; border-radius: 6px; max-width: calc(100% - 24px); }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #flow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #note { position: absolute; right: 12px; top: 10px; font-size: 12px; color: var(--muted); }
  #panel { padding: 14px 16px; overflow: auto; max-height: min(72vh, 760px); }
  #panel h2 { font: 600 16px/1.25 var(--display); margin: 0 0 8px; word-break: break-all; }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
  #panel dt { color: var(--ink-2); } #panel dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  #panel .hint { color: var(--muted); font-size: 13px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--accent-ink); }
  #loops { display: none; padding: 16px; }
  #loops svg { width: 100%; height: auto; display: block; }
  #loops table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  #loops th, #loops td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  #loops td.num, #loops th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; white-space: nowrap; }
  .empty { padding: 40px 16px; color: var(--ink-2); text-align: center; }
  #crumbs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--ink-2); min-height: 20px; }
  #crumbs button { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent-ink); font: inherit; cursor: pointer; text-decoration: underline; }
  #crumbs span.sep { color: var(--muted); }
  .switch { flex-direction: row !important; align-items: center; gap: 6px !important; min-height: 34px; }
  .switch input { accent-color: var(--s1); width: 16px; height: 16px; margin: 0; }
  #panel .summary { color: var(--ink-2); font-size: 13px; margin: -4px 0 12px; }
</style>
</head>
<body>
<header>
  <h1>XRPL Transfer Graph</h1>
  <p class="sub" id="subtitle">Who pays whom on the XRP Ledger, by month. Nodes are entities (accounts grouped by on-ledger evidence); edges are summed transfers.</p>
</header>
<div class="controls" id="controls">
  <label>Month <span id="monthout" class="mono"></span><input type="range" id="month" min="0" max="0" step="1" value="0" aria-describedby="monthout"></label>
  <label>Asset <select id="asset"></select></label>
  <label>View <select id="view">
    <option value="backbone">Backbone (top 300)</option>
    <option value="communities">Community map</option>
    <option value="community">One community</option>
    <option value="ego">Ego view</option>
    <option value="periods">By period</option>
    <option value="loops">Loops over time</option>
  </select></label>
  <label>Colour by <select id="colour"><option value="role">Role</option><option value="community">Community</option></select></label>
  <label><span id="minv-label">Min total value moved</span> <input type="range" id="minv" min="0" max="100" value="0" aria-describedby="minv-out"><span id="minv-out" class="mono"></span></label>
  <label><span id="minn-label">Min total payments</span> <input type="range" id="minn" min="0" max="100" value="0" aria-describedby="minn-out"><span id="minn-out" class="mono"></span></label>
  <label class="switch"><input type="checkbox" id="alledges"> Show all connections</label>
  <label class="switch"><input type="checkbox" id="trace" checked> Trace</label>
  <label class="switch"><input type="checkbox" id="animate"> Animate</label>
  <label>Find an account <input type="search" id="search" placeholder="r… address or entity id" list="egolist"></label>
  <datalist id="egolist"></datalist>
</div>
<main>
  <nav id="crumbs" aria-label="Where you are"></nav>
  <section class="card" id="stage">
    <div id="sigma" role="img" aria-label="Network graph of transfers"></div>
    <canvas id="flow" aria-hidden="true"></canvas>
    <div id="legend"></div>
    <div id="note"></div>
  </section>
  <aside class="card" id="panel"><p class="hint">Hover a node to see its neighbours. Click it for details and sample transactions.</p></aside>
  <section class="card" id="loops" style="grid-column: 1 / -1"></section>
</main>
<div class="tip" id="tip"></div>
<script src="vendor/graphology.umd.min.js"></script>
<script src="vendor/sigma.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (x, d = 3) => x == null ? "–" : Math.abs(x) >= 1e6 ? (x / 1e6).toFixed(2) + " M" : Math.abs(x) >= 1e3
  ? (x / 1e3).toFixed(1) + " k" : (+x).toPrecision(d).replace(/\.?0+$/, "");
const ROLE_COLOURS = [["issuer", "--c1", "Issuer"], ["likely_custodial", "--c2", "Likely custodial"], ["amm_pool", "--c3", "AMM pool"]];
const EXPLORER = "https://livenet.xrpl.org/transactions/";
let egoNote = "", MONTHS = [];
const setMonth = (m) => { const i = Math.max(0, MONTHS.indexOf(m)); $("month").value = i; $("monthout").textContent = ` ${MONTHS[i] || ""}`; };
let clickTimer = null, clickedNode = null;
const CLICK_MS = 280;                      // two clicks within this time on a community are a drill-down
let locked = null;                         // node whose neighbourhood stays in focus after a click
let INDEX = { views: [] }, renderer = null, graph = null, hovered = null, state = {};

const LABELS_DEFAULT = 30;                 // labels at default zoom; graph/layout.py LABELS_DEFAULT
let bundles = new Map(), labelLimit = LABELS_DEFAULT;

function readHash() {
  // "~"-separated: only plain #anchors (letters, digits, . _ ~ -) reach a published page
  // #<view>~<month>~<label>[~<arg>][~all]; arg = C<n> for one community, the entity id for an ego view
  const parts = location.hash.slice(1).split("~");
  const all = parts[parts.length - 1] === "all";
  if (all) parts.pop();
  const [view, month, label, arg] = parts;
  return { view, month, label, arg, all };
}
function hashOf(s) {
  const parts = [s.view, s.month, s.label];
  if (s.view === "ego" && s.centre) parts.push(s.centre);
  if (s.view === "community" && s.comm) parts.push(s.comm);
  if (s.all) parts.push("all");
  return "#" + parts.join("~");
}
function writeHash(push) {
  const h = hashOf(state);
  if (h === location.hash) return;
  if (push) history.pushState(null, "", h); else history.replaceState(null, "", h);
}

function nodeColour(attrs) {
  const other = css("--c-other");
  if (state.colour === "community" || attrs.community != null && graph.getAttribute("kind") === "communities") {
    const c = attrs.community;
    return c === 0 ? css("--c1") : c === 1 ? css("--c2") : c === 2 ? css("--c3") : other;
  }
  const hit = ROLE_COLOURS.find(([r]) => r === attrs.role);
  return hit ? css(hit[1]) : other;
}

function legend() {
  const el = $("legend"); const kind = graph && graph.getAttribute("kind");
  const items = state.colour === "community" || kind === "communities"
    ? [["--c1", "Community 0 (largest)"], ["--c2", "Community 1"], ["--c3", "Community 2"], ["--c-other", "Smaller communities"]]
    : [...ROLE_COLOURS.map(([, v, l]) => [v, l]), ["--c-other", "Hub, bot pair or unknown"]];
  el.innerHTML = items.map(([v, l]) => `<span><i style="background:${css(v)}"></i>${l}</span>`).join("")
    + (styles.flow.on ? "<span>Dots move from payer to payee: bigger dot = larger average transfer, more frequent dots = more payments; a quiet connection can be asleep</span>" : "");
}

// ---------------------------------------------------------------------------------------------------------------
// Connections. Every edge is a connection. WHICH connections are in view is decided once, by `view` (filter rules).
// HOW they are shown is decided by independent styles (trace = the line, flow = moving dots); a style never filters
// and a rule never draws. To add a rule push a function to view.rules; to add a style add an object to `styles`.
// ---------------------------------------------------------------------------------------------------------------
// A measure is a number on every connection that a slider can put a floor under. Sliders run linearly over log(1 + number)
// between the lightest and the heaviest connection in the view. To add a measure, add an entry here and a slider in the controls.
const measures = [
  { id: "minv", label: "Min total value moved", of: (a) => a.value, unit: () => state.label.split("-")[0],
    pos: 0, lo: 0, hi: 1 },
  { id: "minn", label: "Min total payments", of: (a) => a.n, unit: () => "payments", pos: 0, lo: 0, hi: 1 },
];
const cutOf = (m) => m.lo + (m.pos / 100) * (m.hi - m.lo);                  // slider position as a point on the measure's range
const view = {
  focus: () => locked || hovered,
  rules: [                                                                  // each: (id, attrs) -> keep?  The focus rule stays last.
    ...measures.map(m => (e, a) => Math.log1p(m.of(a) || 0) >= cutOf(m) - 1e-9),
    (e, a) => state.all || a.bb !== 0,                                      // backbone only, or every connection
    (e, a) => !view.focus() || graph.hasExtremity(e, view.focus()),         // focused node's connections only
  ],
  includes(e, a) { return this.rules.every(rule => rule(e, a)); },
  list() { const out = []; graph.forEachEdge((e, a, s, t) => { if (this.includes(e, a)) out.push({ id: e, a, source: s, target: t }); }); return out; },
};

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const styles = {
  // Trace: the line itself. It adds arrowheads when no other style shows direction.
  trace: {
    on: true,
    reduce(r, c) { r.type = styles.flow.on ? "line" : "arrow"; if (view.focus()) { r.color = css("--edge-hi"); r.zIndex = 1; } },
  },
  // Flow: a dot is a payment on its way from payer to payee, drawn between the node rims.
  //   dot size      = mean transfer size on the connection (log scale, ranked within the view)
  //   how often     = payment count: busy connections send a dot every few seconds, quiet ones every MAX_GAP seconds, so a
  //                   quiet connection can have nothing in flight for a while ("asleep")
  //   speed         = the same everywhere (SPEED px/s at default zoom); a trip takes length / SPEED; in-out quad ease
  // It is a picture of relative activity, not a replay of when payments happened.
  flow: {
    on: !reducedMotion, SPEED: 25, R_MIN: 1.5, R_MAX: 5, MIN_GAP: 3, MAX_GAP: 60, MAX_IN_FLIGHT: 5, raf: 0, clock: 0, cache: new Map(),
    start() {
      this.stop();
      if (!this.on || !renderer || !graph) return;
      this.cache = new Map(); this.scale = this.prepare();
      let last = performance.now();
      const frame = (now) => { if (!this.on || !renderer || !graph) return; this.clock += Math.min(0.1, (now - last) / 1000); last = now; this.draw(); this.raf = requestAnimationFrame(frame); };
      this.raf = requestAnimationFrame(frame);
    },
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; const cv = $("flow"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); },
    rank(values) {                                                          // 5th to 95th percentile of log values -> 0..1
      const v = values.filter(x => x > 0).map(Math.log10).sort((x, y) => x - y);
      const lo = v.length ? v[Math.floor(v.length * 0.05)] : 0, hi = v.length ? v[Math.floor(v.length * 0.95)] : 1, span = Math.max(hi - lo, 1e-6);
      return (x) => x > 0 ? Math.min(1, Math.max(0, (Math.log10(x) - lo) / span)) : 0.5;
    },
    prepare() {
      const es = graph.mapEdges((e, a) => a);
      return { size: this.rank(es.map(a => a.value / a.n)), count: this.rank(es.map(a => a.n)) };
    },
    dot(c) {
      let d = this.cache.get(c.id);
      if (!d) {
        let h = 0; for (let k = 0; k < c.id.length; k++) h = (h * 31 + c.id.charCodeAt(k)) >>> 0;
        const busy = this.scale.count(c.a.n), size = this.scale.size(c.a.value / c.a.n);
        d = { r: this.R_MIN + size * (this.R_MAX - this.R_MIN),
              gap: this.MAX_GAP * Math.pow(this.MIN_GAP / this.MAX_GAP, busy),   // seconds between two dots leaving the payer
              off: (h % 1000) / 1000 * this.MAX_GAP };                            // so connections do not start in step
        this.cache.set(c.id, d);
      }
      return d;
    },
    draw() {
      const cv = $("flow"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = css("--edge-hi");
      const ratio = renderer.getCamera().ratio;                              // a trip is timed in graph space, so zooming never makes dots jump
      for (const c of view.list()) {
        const p = renderer.graphToViewport(graph.getNodeAttributes(c.source)), q = renderer.graphToViewport(graph.getNodeAttributes(c.target));
        const full = Math.hypot(q.x - p.x, q.y - p.y);
        if (full < 1) continue;
        const ux = (q.x - p.x) / full, uy = (q.y - p.y) / full;
        const rs = renderer.scaleSize(renderer.getNodeDisplayData(c.source).size), rt = renderer.scaleSize(renderer.getNodeDisplayData(c.target).size);
        p.x += ux * rs; p.y += uy * rs; q.x -= ux * rt; q.y -= uy * rt;
        const dx = q.x - p.x, dy = q.y - p.y;
        if (full - rs - rt < 8 || (p.x < -50 && q.x < -50) || (p.x > w + 50 && q.x > w + 50) || (p.y < -50 && q.y < -50) || (p.y > h + 50 && q.y > h + 50)) continue;
        const d = this.dot(c), trip = Math.max(1, full * ratio / this.SPEED);   // seconds from payer to payee
        const gap = Math.max(d.gap, trip / this.MAX_IN_FLIGHT);                 // never more than MAX_IN_FLIGHT dots on one line
        for (let age = (this.clock + d.off) % gap; age < trip; age += gap) {     // each age is a payment that left the payer `age` seconds ago
          const u = age / trip, f = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);   // ease in-out quad
          ctx.globalAlpha = 0.9 * Math.sin(Math.PI * Math.min(1, u / 0.12, (1 - u) / 0.12) / 2);
          ctx.beginPath(); ctx.arc(p.x + dx * f, p.y + dy * f, d.r, 0, 6.2832); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    },
  },
};
// A change of filter or style needs one call: the lines are re-reduced by sigma, the dots read `view` on every frame.
function cutText() {
  for (const m of measures) {
    $(m.id + "-out").textContent = !graph ? "" : m.pos > 0 ? ` ≥ ${fmt(Math.expm1(cutOf(m)))} ${m.unit()}` : " no minimum";
  }
}
// Connections that pass every rule except the focus one (the filters, not the hover).
const keptCount = () => view.rules.slice(0, -1).reduce((l, rule) => l.filter(c => rule(c.id, c.a)), graph.mapEdges((e, a) => ({ id: e, a }))).length;
function restyle() { cutText(); if (renderer) { renderer.refresh(); styles.flow.on ? (styles.flow.raf || styles.flow.start()) : styles.flow.stop(); legend(); note(); } }
function setFocus(node) { locked = node; hovered = null; if (renderer) renderer.refresh(); }

function draw(data) {
  if (renderer) { renderer.kill(); renderer = null; }
  graph = graphology.Graph.from(data);
  locked = null; hovered = null;
  lastDrawn = { view: state.view, label: state.label, month: state.month, centre: state.centre };
  const edgeCol = css("--edge");
  renderer = new Sigma(graph, $("sigma"), {
    defaultEdgeType: "arrow", renderEdgeLabels: false, labelFont: "IBM Plex Sans", labelSize: 11,
    labelColor: { color: css("--ink-2") }, labelRenderedSizeThreshold: 0, labelGridCellSize: 120, zIndex: true,
    nodeReducer: (n, a) => {
      const f = view.focus(), r = { ...a, color: nodeColour(a), label: a.label };
      if (a.label_rank != null && a.label_rank >= labelLimit && n !== f) r.label = null;
      if (f && n !== f && !graph.areNeighbors(n, f)) { r.color = css("--grid"); r.label = ""; r.zIndex = 0; }
      if (a.centre || n === f) { r.highlighted = true; r.zIndex = 2; }
      return r;
    },
    edgeReducer: (e, a) => {
      const r = { ...a, color: edgeCol, size: Math.max(0.3, a.size * 0.8) };
      if (!view.includes(e, a) || !styles.trace.on) r.hidden = true;        // hidden lines do not stop the dots: they read `view`
      else styles.trace.reduce(r, { id: e, a });
      return r;
    },
  });
  renderer.on("enterNode", ({ node }) => { hovered = node; renderer.refresh(); });
  renderer.on("leaveNode", () => { hovered = null; renderer.refresh(); });
  // One click locks the focus on a node (the rest of the graph greys out); one click on it again, the background or Esc releases it.
  // On the community map a second click within CLICK_MS drills down into the community instead.
  clearTimeout(clickTimer); clickTimer = null;
  const toggleFocus = (node) => { setFocus(locked === node ? null : node); if (locked) panel(node); };
  renderer.on("clickNode", ({ node }) => {
    const drillable = graph.getAttribute("kind") === "communities" && graph.getNodeAttribute(node, "has_detail");
    if (!drillable) { toggleFocus(node); return; }
    if (clickTimer && clickedNode === node) { clearTimeout(clickTimer); clickTimer = null; openCommunity(node); return; }
    clearTimeout(clickTimer); clickedNode = node;
    clickTimer = setTimeout(() => { clickTimer = null; toggleFocus(node); }, CLICK_MS);
  });
  renderer.on("clickStage", () => { if (locked) setFocus(null); });
  labelLimit = LABELS_DEFAULT;
  renderer.getCamera().on("updated", ({ ratio }) => {
    const lim = Math.round(LABELS_DEFAULT / Math.min(1, ratio));
    if (lim !== labelLimit) { labelLimit = lim; renderer.refresh(); }
  });
  afterGraph();
}

// Everything that depends on the graph's connections: slider ranges, counts, legend, dots.
function afterGraph() {
  for (const m of measures) {
    const lw = graph.mapEdges((e, a) => Math.log1p(m.of(a) || 0));
    m.lo = lw.length ? Math.min(...lw) : 0; m.hi = lw.length ? Math.max(...lw) : 1;
  }
  note();
  legend();
  cutText();
  styles.flow.start();
}

// Month to month on the backbone: the same sigma instance, nodes found in both months glide to their new place and size,
// new nodes grow in, nodes that left shrink away, and the connections are swapped in when the nodes have settled.
let lastDrawn = null, morphing = null;
const MORPH_MS = 700;
const canMorph = () => !reducedMotion && renderer && graph && !morphing && lastDrawn && state.view === "backbone"
  && lastDrawn.view === state.view && lastDrawn.label === state.label && lastDrawn.month !== state.month;
function morph(data) {
  const next = graphology.Graph.from(data), targets = {}, leaving = [];
  styles.flow.stop(); locked = null; hovered = null;
  graph.clearEdges();
  graph.forEachNode((key) => { if (!next.hasNode(key)) { leaving.push(key); targets[key] = { size: 0 }; graph.setNodeAttribute(key, "label", ""); } });
  next.forEachNode((key, a) => {
    if (graph.hasNode(key)) { const { x, y, size, ...rest } = a; graph.mergeNodeAttributes(key, rest); targets[key] = { x, y, size }; }
    else { graph.addNode(key, { ...a, size: 0 }); targets[key] = { x: a.x, y: a.y, size: a.size }; }
  });
  lastDrawn.month = state.month;
  morphing = { cancel: Sigma.utils.animateNodes(graph, targets, { duration: MORPH_MS, easing: "quadraticInOut" }, () => {
    morphing = null;
    leaving.forEach(k => graph.dropNode(k));
    next.forEachEdge((e, a, s, t) => graph.addEdgeWithKey(e, s, t, a));
    graph.replaceAttributes(next.getAttributes());
    afterGraph();
  }) };
}

function note() {
  if (!graph) return;
  const at = graph.getAttributes(), hiddenEdges = at.n_hidden_edges;
  const drawn = keptCount();
  $("note").textContent = `${graph.order} nodes · ${drawn.toLocaleString()} of ${graph.size.toLocaleString()} connections shown`
    + (hiddenEdges ? ` · ${hiddenEdges.toLocaleString()} lighter connections not loaded` : "");
}

function crumbs() {
  const el = $("crumbs"), parts = [], s = state;
  const btn = (text, fn) => { const b = document.createElement("button"); b.textContent = text; b.onclick = fn; return b; };
  parts.push(document.createTextNode(`${s.month} › ${s.label} › `));
  if (s.view === "community" || (s.view === "ego" && s.from)) {
    parts.push(btn("Community map", () => navigate({ view: "communities", comm: undefined, centre: undefined, from: undefined })));
    if (s.view === "community") parts.push(document.createTextNode(` › ${s.commName || s.comm}`));
    else {
      parts.push(document.createTextNode(" › "));
      parts.push(btn(s.from.name || s.from.comm, () => navigate({ view: "community", comm: s.from.comm, centre: undefined, from: undefined })));
      parts.push(document.createTextNode(` › ${(s.centre || "").slice(0, 10)}…`));
    }
  } else {
    const names = { backbone: "Backbone", communities: "Community map", ego: "Ego view", periods: "By period", loops: "Loops over time" };
    parts.push(document.createTextNode(names[s.view] + (s.view === "ego" && s.centre ? ` › ${s.centre.slice(0, 10)}…` : "")));
  }
  el.replaceChildren(...parts);
}

function navigate(change) {
  Object.assign(state, change);
  $("view").value = state.view; setMonth(state.month);
  render(true);
}

function openCommunity(node) {
  const a = graph.getNodeAttributes(node);
  navigate({ view: "community", comm: node, commName: a.name, centre: undefined, from: undefined });
}

function panel(node) {
  const a = graph.getNodeAttributes(node), kind = graph.getAttribute("kind"), unit = state.label.split("-")[0];
  const rows = kind === "communities"
    ? [["Entities", a.n_entities?.toLocaleString()], ["Largest members", (a.top_entities || []).map(x => `<code>${x.slice(0, 10)}…</code>`).join("<br>")]]
    : [["Role", (a.role || "unknown").replace("_", " ")], ["Accounts in entity", a.n_accounts], ["Community", a.community ?? "–"],
       ["Bow-tie part", a.bowtie], ["PageRank", fmt(a.pagerank)], ["Transfers in / out", `${fmt(a.in_n)} / ${fmt(a.out_n)}`],
       [`Value in / out (${unit})`, `${fmt(a.in_value)} / ${fmt(a.out_value)}`],
       ["Flow Index A1 / A2", `${fmt(a.flow_in)} / ${fmt(a.flow_out)}`], ...(a.ppr != null ? [["Personalized PageRank", fmt(a.ppr)]] : [])];
  const top = graph.edges(node).map(e => [e, graph.getEdgeAttributes(e)]).sort((x, y) => (y[1].n || 0) - (x[1].n || 0)).slice(0, 5);
  const tx = top.flatMap(([e, ea]) => (ea.hashes || []).slice(0, 1).map(h =>
    `<li><a href="${EXPLORER}${h}" target="_blank" rel="noopener"><code>${h.slice(0, 12)}…</code></a> ${graph.source(e) === node ? "to" : "from"} <code>${(graph.source(e) === node ? graph.target(e) : graph.source(e)).slice(0, 8)}</code></li>`));
  $("panel").innerHTML = `<h2>${kind === "communities" ? (a.name || a.label) : `<code>${node}</code>`}</h2>`
    + (kind === "communities" && a.summary ? `<p class="summary">${a.summary}</p>` : "")
    + (kind === "communities" && a.detail ? `<p class="hint">${a.detail}</p>` : "")
    + `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v ?? "–"}</dd>`).join("")}</dl>`
    + (kind !== "communities" ? `<button id="egobtn">Open ego view</button>` : "")
    + (kind === "communities" && a.has_detail ? `<button id="commbtn">Open community</button>` : "")
    + (tx.length ? `<p class="hint">Sample transactions on its biggest edges:</p><ul class="mono">${tx.join("")}</ul>` : "");
  const b = $("egobtn"); if (b) b.onclick = () => openEgo(node);
  const cb = $("commbtn"); if (cb) cb.onclick = () => openCommunity(node);
}

function openEgo(centre) {
  const v = INDEX.views.find(x => x.kind === "ego" && x.month === state.month && x.label === state.label && x.centre === centre);
  if (!v) {
    $("panel").insertAdjacentHTML("beforeend", `<p class="hint">No precomputed ego view for this entity. Build one with<br><code>uv run graph/run.py ego ${centre} --month ${state.month} --asset ${state.label.split("-")[0]}</code></p>`);
    return;
  }
  const from = state.view === "community" ? { comm: state.comm, name: state.commName } : undefined;
  navigate({ view: "ego", centre, from });
}

async function render(push) {
  writeHash(push);
  crumbs();
  const loops = state.view === "loops" || state.view === "periods";
  $("loops").style.display = loops ? "block" : "none";
  $("stage").style.display = $("panel").style.display = loops ? "none" : "";
  if (loops) return state.view === "periods" ? drawPeriods() : drawLoops();
  let v;
  if (state.view === "ego") {
    const egoViews = (m) => INDEX.views.filter(x => x.kind === "ego" && x.month === m && x.label === state.label);
    let egos = egoViews(state.month);
    if (!egos.length) {                                                       // not every month has ego views: move to the latest one that does
      const m = INDEX.views.filter(x => x.kind === "ego" && x.label === state.label).map(x => x.month).sort().pop();
      if (m) { egoNote = `No ego views for ${state.month}; showing ${m}.`; state.month = m; setMonth(m); egos = egoViews(m); }
    }
    $("egolist").innerHTML = egos.map(x => `<option value="${x.centre}">`).join("");
    v = egos.find(x => x.centre === state.centre) || egos[0];
    if (v) state.centre = v.centre;
  } else if (state.view === "community") {
    v = INDEX.views.find(x => x.kind === "community_detail" && x.month === state.month && x.label === state.label);
    if (v) {
      if (!bundles.has(v.file)) bundles.set(v.file, await (await fetch("graph/" + v.file)).json());
      const b = bundles.get(v.file).communities;
      if (!state.comm || !b[state.comm]) state.comm = Object.keys(b)[0];
      const data = b[state.comm];
      state.commName = data.attributes.name || state.comm;
      draw(data);
      $("panel").innerHTML = `<h2>${state.commName}</h2>` + (data.attributes.summary ? `<p class="summary">${data.attributes.summary}</p>` : "")
        + `<p class="hint">The ${graph.order} entities most strongly tied to <code>${state.commName.split(" · ")[1] || ""}</code> inside this community, with its significant edges. Hover a node to see its neighbours; click it for details.</p>`;
      writeHash(); crumbs();
      return;
    }
  } else {
    v = INDEX.views.find(x => x.kind === state.view && x.month === state.month && x.label === state.label);
  }
  if (!v) {
    if (renderer) renderer.kill(); renderer = null; graph = null; styles.flow.stop();
    $("note").textContent = "";
    $("panel").innerHTML = `<p class="hint">No ${state.view} view for ${state.month} and ${state.label}.${state.view === "ego" ? " Ego views are built for chosen entities only." : ""}</p>`;
    return;
  }
  const data = await (await fetch("graph/" + v.file)).json();
  if (morphing) { morphing.cancel(); morphing = null; lastDrawn = null; }      // a new request while one is still moving: start clean
  if (canMorph()) morph(data); else draw(data);
  if (state.view === "ego") { panel(state.centre); if (egoNote) { $("panel").insertAdjacentHTML("afterbegin", `<p class="hint">${egoNote}</p>`); egoNote = ""; } }
  else $("panel").innerHTML = '<p class="hint">Hover a node to see its neighbours. Click it for details' + (state.view === "communities" ? ", and it stays isolated; click it again to release it, or double-click to open the community." : " and sample transactions.") + "</p>";
  writeHash(); crumbs();
}

// By period: one bar per month, or per year, for the selected asset. The date selector switches the grain.
// Counts of transfers add up over a year; every other measure is the average of that year's months.
const PERIOD_METRICS = {
  n_transfers: { label: "Transfers", sum: true, f: fmt },
  n_nodes: { label: "Entities", f: fmt }, n_edges: { label: "Connections", f: fmt }, n_communities: { label: "Communities", f: fmt },
  modularity: { label: "Modularity", f: (v) => v.toFixed(2) },
  loop_share: { label: "Share of flow in loops", f: (v) => (v * 100).toFixed(1) + "%" },
  reciprocity: { label: "Reciprocity", f: (v) => (v * 100).toFixed(1) + "%" },
  giant_wcc_share: { label: "Entities in the largest component", f: (v) => (v * 100).toFixed(1) + "%" },
};
let periodGrain = "month", periodMetric = "n_transfers";
async function drawPeriods() {
  const el = $("loops");
  let d;
  try { d = await (await fetch("graph/loops.json")).json(); } catch { el.innerHTML = '<p class="empty">No monthly data yet.</p>'; return; }
  const rows = d.summary.filter(r => r.asset_label === state.label);
  const m = PERIOD_METRICS[periodMetric];
  const groups = new Map();
  for (const r of rows) { const k = periodGrain === "year" ? r.month.slice(0, 4) : r.month; (groups.get(k) || groups.set(k, []).get(k)).push(r); }
  const bars = [...groups].sort((a, b) => a[0].localeCompare(b[0])).map(([k, rs]) => {
    const vals = rs.map(r => r[periodMetric]).filter(v => v != null);
    const v = vals.length ? vals.reduce((a, b) => a + b, 0) / (m.sum ? 1 : vals.length) : null;
    return { k, v, months: rs.map(r => r.month).sort() };
  });
  const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}"${v === cur ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  const head = `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;margin-bottom:8px">
    <label style="display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2)">Date ${sel("pgrain", [["month", "By month"], ["year", "By year"]], periodGrain)}</label>
    <label style="display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2)">Measure ${sel("pmetric", Object.entries(PERIOD_METRICS).map(([k, x]) => [k, x.label]), periodMetric)}</label></div>`;
  const note = periodGrain === "year" ? (m.sum ? "Sum of the months in the data." : "Average of the months in the data.")
    + " A year with fewer than 12 months covers only the months available." : "";
  const W = 900, H = 300, L = 64, R = 16, T = 16, B = 34, ink2 = css("--ink-2"), grid = css("--grid"), muted = css("--muted");
  const max = Math.max(1e-9, ...bars.map(b => b.v || 0)), bw = (W - L - R) / Math.max(1, bars.length);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.label} by ${periodGrain}">`;
  for (const t of [0, 0.5, 1]) { const y = T + (1 - t) * (H - T - B); svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${muted}">${m.f(max * t)}</text>`; }
  bars.forEach((b, i) => {
    const h = b.v == null ? 0 : (b.v / max) * (H - T - B), x = L + i * bw + bw * 0.15;
    svg += `<rect class="pbar" data-i="${i}" x="${x}" y="${H - B - h}" width="${bw * 0.7}" height="${h}" rx="3" fill="${css("--c1")}" style="cursor:pointer"><title>${b.k}: ${b.v == null ? "–" : m.f(b.v)}</title></rect>`;
    if (bars.length <= 14 || i % Math.ceil(bars.length / 10) === 0) svg += `<text x="${x + bw * 0.35}" y="${H - 12}" text-anchor="middle" font-size="11" fill="${muted}">${b.k}</text>`;
  });
  svg += "</svg>";
  el.innerHTML = `<h2 style="font:600 16px var(--display);margin:0 0 8px">${m.label} by ${periodGrain}, ${state.label}</h2>${head}
    <p class="sub" style="margin:0 0 8px">${note} Click a bar to open that ${periodGrain === "year" ? "year's latest month" : "month"} in the backbone view.</p>${svg}`;
  $("pgrain").onchange = (e) => { periodGrain = e.target.value; drawPeriods(); };
  $("pmetric").onchange = (e) => { periodMetric = e.target.value; drawPeriods(); };
  el.querySelectorAll(".pbar").forEach(r => r.addEventListener("click", () => {
    const b = bars[+r.dataset.i]; navigate({ view: "backbone", month: b.months[b.months.length - 1], centre: undefined, comm: undefined, from: undefined });
  }));
}

async function drawLoops() {
  const el = $("loops");
  let d;
  try { d = await (await fetch("graph/loops.json")).json(); } catch { el.innerHTML = '<p class="empty">No loop data yet.</p>'; return; }
  const series = ["XRP", "RLUSD", "all"].map((lab, i) => ({ lab, col: css(`--c${i + 1}`),
    pts: d.summary.filter(r => (r.asset_label === lab || (lab === "RLUSD" && r.asset_label.startsWith("RLUSD-"))) && r.loop_share != null)
      .map(r => [r.month, r.loop_share]) })).filter(s => s.pts.length);
  const months = [...new Set(d.summary.map(r => r.month))].sort();
  const W = 900, H = 320, L = 48, R = 90, T = 16, B = 34;
  const x = (m) => L + (months.length < 2 ? (W - L - R) / 2 : months.indexOf(m) * (W - L - R) / (months.length - 1));
  const y = (v) => T + (1 - v) * (H - T - B);
  const ink2 = css("--ink-2"), grid = css("--grid"), muted = css("--muted");
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of net flow that circulates in loops, by month">`;
  for (const t of [0, 0.25, 0.5, 0.75, 1]) svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${grid}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="${muted}">${t * 100}%</text>`;
  months.forEach((m, i) => { if (i % Math.ceil(months.length / 8) === 0 || i === months.length - 1) svg += `<text x="${x(m)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="${muted}">${m}</text>`; });
  for (const s of series) {
    svg += `<path d="${s.pts.map((p, i) => (i ? "L" : "M") + x(p[0]) + " " + y(p[1])).join("")}" fill="none" stroke="${s.col}" stroke-width="2"/>`;
    for (const p of s.pts) svg += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${s.col}" stroke="${css("--surface")}" stroke-width="2"/>`;
    const last = s.pts[s.pts.length - 1];
    svg += `<text x="${x(last[0]) + 10}" y="${y(last[1]) + 4}" font-size="12" fill="${ink2}">${s.lab} ${(last[1] * 100).toFixed(1)}%</text>`;
  }
  svg += `<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/><line id="cross" y1="${T}" y2="${H - B}" stroke="${ink2}" stroke-dasharray="3 3" visibility="hidden"/></svg>`;
  const rows = d.cycles.map(c => `<tr><td>${c.asset_label}</td><td class="num">${c.rank + 1}</td><td class="num">${c.length}</td><td>${c.entities.map(e => `<code>${e.slice(0, 8)}</code>`).join(" → ")} → <code>${c.entities[0].slice(0, 8)}</code></td><td class="num">${fmt(c.strength)}</td><td>${(c.hashes || []).slice(0, 2).map(h => `<a href="${EXPLORER}${h}" target="_blank" rel="noopener"><code>${h.slice(0, 10)}…</code></a>`).join(" ")}</td></tr>`).join("");
  el.innerHTML = `<h2 style="font:600 16px var(--display);margin:0 0 4px">Share of net flow that goes round in loops</h2>
    <p class="sub" style="margin:0 0 8px">Hodge decomposition of each month's net flow between entities: the rest is one-way (gradient) flow. Legend: ${series.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><i style="width:10px;height:10px;border-radius:50%;background:${s.col};display:inline-block"></i>${s.lab}</span>`).join("")}</p>
    ${svg}<h3 style="font:600 14px var(--display);margin:16px 0 0">Strongest cycles, ${d.cycles_month}</h3>
    <table><thead><tr><th>Asset</th><th class="num">Rank</th><th class="num">Length</th><th>Entities</th><th class="num">Strength</th><th>Sample transactions</th></tr></thead><tbody>${rows}</tbody></table>`;
  const tip = $("tip"), hit = el.querySelector("#hit"), cross = el.querySelector("#cross"), box = el.querySelector("svg");
  hit.addEventListener("mousemove", (ev) => {
    const r = box.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const m = months.reduce((b, mm) => Math.abs(x(mm) - px) < Math.abs(x(b) - px) ? mm : b, months[0]);
    cross.setAttribute("x1", x(m)); cross.setAttribute("x2", x(m)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${m}</b><br>` + series.map(s => { const p = s.pts.find(q => q[0] === m); return `${s.lab}: ${p ? (p[1] * 100).toFixed(1) + "%" : "–"}`; }).join("<br>");
    tip.style.display = "block"; tip.style.left = ev.pageX + 12 + "px"; tip.style.top = ev.pageY + 12 + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
}

function fillSelects() {
  const months = [...new Set(INDEX.views.map(v => v.month))].sort();
  const labels = [...new Set(INDEX.views.map(v => v.label))].filter(l => l !== "all").sort((a, b) => (a === "XRP" ? -1 : b === "XRP" ? 1 : a.localeCompare(b)));
  MONTHS = months; $("month").max = months.length - 1;
  $("asset").innerHTML = labels.map(l => `<option>${l}</option>`).join("");
  const h = readHash();
  const views = ["backbone", "communities", "community", "ego", "periods", "loops"];
  state = { view: views.includes(h.view) ? h.view : "backbone", month: months.includes(h.month) ? h.month : months[months.length - 1],
            label: labels.includes(h.label) ? h.label : labels[0], centre: h.view === "ego" ? h.arg : undefined,
            comm: h.view === "community" ? h.arg : undefined, all: h.all, colour: "role" };
  setMonth(state.month); $("asset").value = state.label; $("view").value = state.view; $("alledges").checked = !!state.all;
}

$("month").addEventListener("input", (e) => { $("monthout").textContent = ` ${MONTHS[+e.target.value]}`; });   // the label follows the thumb; the view loads on release
for (const id of ["month", "asset", "view"]) $(id).addEventListener("change", (e) => {
  state[id === "asset" ? "label" : id] = id === "month" ? MONTHS[+e.target.value] : e.target.value;
  if (id !== "view") { state.centre = undefined; state.comm = undefined; }
  state.from = undefined;
  render(true); });
$("alledges").addEventListener("change", (e) => { state.all = e.target.checked; writeHash(); restyle(); });
window.addEventListener("popstate", () => {
  const h = readHash();
  if (!h.view) return;
  Object.assign(state, { view: h.view, month: h.month || state.month, label: [...$("asset").options].some(o => o.value === h.label) ? h.label : state.label,
    centre: h.view === "ego" ? h.arg : undefined, comm: h.view === "community" ? h.arg : undefined, all: h.all, from: undefined });
  setMonth(state.month); $("asset").value = state.label; $("view").value = state.view; $("alledges").checked = !!state.all;
  render();
});
$("trace").addEventListener("change", (e) => { styles.trace.on = e.target.checked; restyle(); });
$("animate").checked = styles.flow.on;
$("animate").addEventListener("change", (e) => { styles.flow.on = e.target.checked; restyle(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && locked) setFocus(null); });
$("colour").addEventListener("change", (e) => { state.colour = e.target.value; if (renderer) { renderer.refresh(); legend(); } });
for (const m of measures) $(m.id).addEventListener("input", (e) => { m.pos = +e.target.value; restyle(); });
$("search").addEventListener("change", (e) => {
  const q = e.target.value.trim(); if (!q) return;
  if (graph && graph.hasNode(q) && state.view !== "ego") { panel(q); setFocus(q); return; }
  const v = INDEX.views.find(x => x.kind === "ego" && x.month === state.month && x.label === state.label && x.centre === q);
  if (v) navigate({ view: "ego", centre: q, from: undefined }); else $("panel").innerHTML = `<p class="hint">No precomputed ego view for <code>${q}</code> in ${state.month}. Accounts inside a grouped entity use the entity id. Build one with<br><code>uv run graph/run.py ego ${q} --month ${state.month}</code></p>`;
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (renderer) { renderer.refresh(); legend(); } });

if (window.INLINE_GRAPH) {
  $("controls").style.display = "none"; $("subtitle").textContent = window.INLINE_NOTE || "";
  state = { colour: "role", label: "XRP" }; draw(window.INLINE_GRAPH);
} else {
  fetch("graph/index.json").then(r => r.json()).then(d => { INDEX = d; fillSelects(); render(); })
    .catch(() => { $("stage").innerHTML = '<p class="empty">No graph views yet: run <code>uv run graph/run.py all</code>.</p>'; });
}
</script>
</body>
</html>
