[project]
name = "xrpl-open-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "powerlaw>=2.0.0",
    "pyarrow>=25.0.1",
    "python-igraph>=1.0.0",
    "pytz>=2026.5",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
